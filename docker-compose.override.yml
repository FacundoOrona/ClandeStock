version: '3.8'

services:
  backend:
    build:
      context: ./clandestock-backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./clandestock-backend:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: mvn spring-boot:run
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 0"]
      interval: 20s
      timeout: 10s
      retries: 30

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./clandestock-frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
